name: Build and Release BranchSwitcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\BranchSwitcher\BranchSwitcher.csproj

      - name: Publish
        run: >
          dotnet publish
          .\BranchSwitcher\BranchSwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Copy configs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".\publish\configs"

          if (Test-Path ".\configs") {
              Copy-Item ".\configs\*.conf" ".\publish\configs\" -Force
          }

      - name: Copy documentation
        shell: pwsh
        run: |
          if (Test-Path ".\user-guide.pdf") {
              Copy-Item ".\user-guide.pdf" ".\publish\user-guide.pdf"
          }

          if (Test-Path ".\BranchSwitcher\settings.example.json") {
              Copy-Item ".\BranchSwitcher\settings.example.json" ".\publish\settings.example.json"
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ".\publish\*" `
            -DestinationPath ".\BranchSwitcher-Windows-x64.zip" `
            -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            ".\BranchSwitcher-Windows-x64.zip" `
            --title "BranchSwitcher ${{ github.ref_name }}" `
            --generate-notes
